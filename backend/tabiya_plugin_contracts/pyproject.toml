[tool.poetry]
name = "tabiya-plugin-contracts"
version = "0.1.0"
description = "Shared plugin contract types (Manifest, InvokeRequest, InvokeResponse, ErrorEnvelope, Health, slot payloads) for the Tabiya classifier pipeline architecture. Source-of-truth for both Python bundles and TypeScript frontend clients."
authors = ["Tabiya <tabiya@tabiya.org>"]
packages = [{ include = "tabiya_plugin_contracts" }]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
fastapi = "^0.111.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
