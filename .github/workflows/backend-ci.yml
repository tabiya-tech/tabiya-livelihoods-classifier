name: Backend CI

on:
  workflow_call:
    inputs:
      upload-artifacts:
        required: true
        type: boolean
        description: "Whether to build and push Docker images"
      stack:
        required: false
        type: string
        default: dev
        description: "Stack name (used as GitHub environment for secrets)"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: shared
            path: backend/shared
            needs_shared: false
          - service: ner
            path: backend/ner
            needs_shared: false
          - service: nel
            path: backend/nel
            needs_shared: true
          - service: classify
            path: backend/classify
            needs_shared: false
          - service: nel_v2
            path: backend/nel_v2
            needs_shared: true
          - service: classify_v2
            path: backend/classify_v2
            needs_shared: false
          - service: tabiya_plugin_contracts
            path: backend/tabiya_plugin_contracts
            needs_shared: false
          - service: tabiya_core
            path: backend/plugin_bundles/tabiya_core
            needs_shared: false
          - service: tabiya_io
            path: backend/plugin_bundles/tabiya_io
            needs_shared: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install shared
        if: matrix.needs_shared
        working-directory: backend/shared
        run: poetry install --no-root

      - name: Install dependencies
        # `shared` is a library, not a service: install it without its own root package
        # so its language-registry tests run without pulling a service's deps.
        run: poetry install --no-interaction ${{ matrix.service == 'nel_v2' && '--extras inference' || '' }} ${{ matrix.service == 'shared' && '--no-root' || '' }}
        working-directory: ${{ matrix.path }}

      - name: Run tests
        run: poetry run pytest
        working-directory: ${{ matrix.path }}

  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: inputs.upload-artifacts
    environment: ${{ inputs.stack }}
    strategy:
      matrix:
        include:
          - service: ner
            dockerfile: backend/ner/Dockerfile
          - service: nel
            dockerfile: backend/nel/Dockerfile
          - service: classify
            dockerfile: backend/classify/Dockerfile
          - service: nel_v2
            dockerfile: backend/nel_v2/Dockerfile
          - service: classify_v2
            dockerfile: backend/classify_v2/Dockerfile
          - service: tabiya_core
            dockerfile: backend/plugin_bundles/tabiya_core/Dockerfile
          - service: tabiya_io
            dockerfile: backend/plugin_bundles/tabiya_io/Dockerfile
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tabiya-classifier"
          echo "${{ secrets.HF_TOKEN }}" > /tmp/hf_token
          docker build \
            -f ${{ matrix.dockerfile }} \
            --secret id=HF_TOKEN,src=/tmp/hf_token \
            -t ${REGISTRY}/${{ matrix.service }}:${{ github.sha }} \
            -t ${REGISTRY}/${{ matrix.service }}:latest \
            .
          rm -f /tmp/hf_token

      - name: Push Docker image
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tabiya-classifier"
          docker push ${REGISTRY}/${{ matrix.service }}:${{ github.sha }}
          docker push ${REGISTRY}/${{ matrix.service }}:latest
          echo "IMAGE=${REGISTRY}/${{ matrix.service }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
