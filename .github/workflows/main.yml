name: CI

on:
  push:
    branches: ["**"]

# Only one deploy at a time; cancel in-progress CI runs on the same branch
# but never cancel a deploy that is already running.
concurrency:
  group: ${{ github.workflow }}-${{ (contains(github.event.head_commit.message, '[deploy dev]') || github.ref_name == 'dev') && 'deploying' || github.ref_name }}
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit
    with:
      # Build and push images when deploying to dev (via flag on any branch, or merge to dev)
      upload-artifacts: ${{ contains(github.event.head_commit.message, '[deploy dev]') || github.ref_name == 'dev' }}
      stack: dev

  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  deploy-dev:
    name: Deploy dev
    needs: [backend-ci, frontend-ci]
    if: contains(github.event.head_commit.message, '[deploy dev]') || github.ref_name == 'dev'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      stack: dev

  # deploy-prod:
