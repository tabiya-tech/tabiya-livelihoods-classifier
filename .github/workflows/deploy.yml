name: Deploy

run-name: Deploy ${{ inputs.stack }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to deploy (dev / staging / prod)"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
        description: "Stack to deploy"

# Shared setup for every deploy job.
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Phase 1: infra that doesn't depend on the frontend ─────────────────────
  deploy-backend:
    name: Deploy backend infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    outputs:
      # Pass Firebase outputs to the parallel frontend-build jobs.
      firebase_api_key:    ${{ steps.firebase.outputs.api_key }}
      firebase_auth_domain: ${{ steps.firebase.outputs.auth_domain }}
      firebase_project_id:  ${{ steps.firebase.outputs.project_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Python dependencies
        run: |
          pip install \
            -r iac/scripts/requirements.txt \
            -r iac/enable-services/requirements.txt \
            -r iac/auth/requirements.txt \
            -r iac/backend/requirements.txt \
            -r iac/common/requirements.txt \
            -r iac/aws-ns/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Pulumi
        run: pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Prepare configs
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tabiya-classifier"
          python iac/scripts/prepare.py \
            --stack "${{ inputs.stack }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --ner-image         "${REGISTRY}/ner:${{ github.sha }}" \
            --nel-image         "${REGISTRY}/nel:${{ github.sha }}" \
            --classify-image    "${REGISTRY}/classify:${{ github.sha }}" \
            --nel-v2-image      "${REGISTRY}/nel_v2:${{ github.sha }}" \
            --classify-v2-image "${REGISTRY}/classify_v2:${{ github.sha }}" \
            --tabiya-core-image "${REGISTRY}/tabiya_core:${{ github.sha }}" \
            --tabiya-io-image   "${REGISTRY}/tabiya_io:${{ github.sha }}"

      # enable-services and auth are fast (~3 s each) but must precede backend.
      - name: Deploy enable-services
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module enable-services
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy auth
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module auth
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy backend
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module backend
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # ── Expose Firebase outputs so frontend builds can run in parallel ──────
      - name: Get Firebase config from auth stack
        id: firebase
        run: |
          python - <<'EOF'
          import pulumi.automation as auto, os

          stack = auto.select_stack(
              stack_name="${{ inputs.stack }}",
              work_dir="iac/auth",
          )
          outputs = stack.outputs()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"api_key={outputs['firebase_api_key'].value}\n")
              f.write(f"project_id={outputs['firebase_project_id'].value}\n")
              f.write(f"auth_domain={outputs['firebase_auth_domain'].value}\n")
          EOF
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # ── Phase 2: build app and docs in parallel, both need Firebase config ──────
  build-frontend:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: deploy-backend
    strategy:
      matrix:
        app: [app, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ matrix.app }}/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: ${{ matrix.app }}

      - name: Build
        run: yarn build
        working-directory: ${{ matrix.app }}
        env:
          VITE_FIREBASE_API_KEY:    ${{ needs.deploy-backend.outputs.firebase_api_key }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ needs.deploy-backend.outputs.firebase_auth_domain }}
          VITE_FIREBASE_PROJECT_ID: ${{ needs.deploy-backend.outputs.firebase_project_id }}
          VITE_API_BASE_URL: ${{ secrets.APP_API_BASE_URL }}
          VITE_DOCS_URL:     ${{ secrets.APP_DOCS_URL }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: ${{ matrix.app }}/dist
          retention-days: 1

  # ── Phase 3: deploy frontend (needs both built dists) ──────────────────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Python dependencies
        run: pip install -r iac/frontend/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Pulumi
        run: pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Download app dist
        uses: actions/download-artifact@v4
        with:
          name: dist-app
          path: app/dist

      - name: Download docs dist
        uses: actions/download-artifact@v4
        with:
          name: dist-docs
          path: docs/dist

      - name: Deploy frontend
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module frontend
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          APP_DIST_DIR: ${{ github.workspace }}/app/dist
          DOCS_DIST_DIR: ${{ github.workspace }}/docs/dist

  # ── Phase 4: common + aws-ns in parallel (both depend on frontend) ──────────
  deploy-common:
    name: Deploy common
    runs-on: ubuntu-latest
    needs: deploy-frontend
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Python dependencies
        run: pip install -r iac/common/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Pulumi
        run: pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy common
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module common
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  deploy-aws-ns:
    name: Deploy aws-ns
    runs-on: ubuntu-latest
    needs: deploy-frontend
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Python dependencies
        run: pip install -r iac/aws-ns/requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Login to Pulumi
        run: pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy aws-ns
        run: python iac/scripts/up.py --stack "${{ inputs.stack }}" --module aws-ns
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
