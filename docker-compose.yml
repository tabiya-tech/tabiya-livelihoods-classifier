services:
  ner:
    build:
      context: .
      dockerfile: backend/ner/Dockerfile
    ports:
      - "5002:5002"
    env_file: .env
    environment:
      # NER_MODEL / NER_MODEL_<LANG>: unset uses each language's configured checkpoint
      # (shared/languages/). Setting the bare variable pins EVERY language to one model.
      - NER_MODEL=${NER_MODEL:-}
      - NER_MODEL_ES=${NER_MODEL_ES:-}
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-en}
      - ENABLED_LANGUAGES=${ENABLED_LANGUAGES:-all}
      - HF_TOKEN=${HF_TOKEN}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-50000}
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nel:
    build:
      context: .
      dockerfile: backend/nel/Dockerfile
    ports:
      - "5003:5003"
    env_file: .env
    environment:
      # Unset uses each language's configured model (shared/languages/); the bare variable
      # would pin every language to one.
      - LINKER_MODEL=${LINKER_MODEL:-}
      - LINKER_MODEL_ES=${LINKER_MODEL_ES:-}
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-en}
      - ENABLED_LANGUAGES=${ENABLED_LANGUAGES:-all}
      - MAX_ENTITIES_PER_REQUEST=${MAX_ENTITIES_PER_REQUEST:-200}
      - MAX_TOP_K=${MAX_TOP_K:-50}
      # NEL_FILES_PATH unset: the data packs are per language under nel/nel/files/<lang>/,
      # and setting it pins every language to one directory. Mount over that path instead
      # if you need to supply packs from outside the image.
      - NEL_FILES_PATH=${NEL_FILES_PATH:-}
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  classify:
    build:
      context: .
      dockerfile: backend/classify/Dockerfile
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      - NER_API_URL=http://ner:5002
      - NEL_API_URL=http://nel:5003
      - CLASSIFIER_VERSION=${CLASSIFIER_VERSION:-1.0.0}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-50000}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-500}
      - APPLICATION_MONGODB_URI=${APPLICATION_MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-tabiya-classifier}
      - API_KEY_CACHE_TTL=${API_KEY_CACHE_TTL:-300}
      - TARGET_ENVIRONMENT_TYPE=${TARGET_ENVIRONMENT_TYPE:-local}
    depends_on:
      ner:
        condition: service_started
      nel:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-cache:
