services:
  ner:
    build:
      context: .
      dockerfile: backend/ner/Dockerfile
    ports:
      - "5002:5002"
    env_file: .env
    environment:
      # NER_MODEL / NER_MODEL_<LANG>: unset uses each language's configured checkpoint
      # (shared/languages/). Setting the bare variable pins EVERY language to one model.
      - NER_MODEL=${NER_MODEL:-}
      - NER_MODEL_ES=${NER_MODEL_ES:-}
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-en}
      - ENABLED_LANGUAGES=${ENABLED_LANGUAGES:-all}
      - HF_TOKEN=${HF_TOKEN}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-50000}
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nel:
    build:
      context: .
      dockerfile: backend/nel_v2/Dockerfile
      secrets:
        - HF_TOKEN
    ports:
      - "5003:5003"
    env_file: .env
    environment:
      - APPLICATION_MONGODB_URI=${APPLICATION_MONGODB_URI:-}
      - APPLICATION_DATABASE_NAME=${APPLICATION_DATABASE_NAME:-classifier_application_dev}
      - TAXONOMY_MONGODB_URI=${TAXONOMY_MONGODB_URI:-}
      - TAXONOMY_DATABASE_NAME=${TAXONOMY_DATABASE_NAME:-classifier_taxonomy_dev}
      - TAXONOMY_API_BASE_URL=${TAXONOMY_API_BASE_URL:-https://taxonomy.tabiya.tech}
      - TAXONOMY_API_KEY=${TAXONOMY_API_KEY:-}
      - DEFAULT_NEL_MODEL_ID=${DEFAULT_NEL_MODEL_ID:-all-MiniLM-L6-v2}
      - DEFAULT_TAXONOMY_MODEL_ID=${DEFAULT_TAXONOMY_MODEL_ID:-}
      - VERTEX_API_REGION=${VERTEX_API_REGION:-us-central1}
      - TARGET_ENVIRONMENT_TYPE=${TARGET_ENVIRONMENT_TYPE:-local}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/v2/nel/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  classify:
    build:
      context: .
      dockerfile: backend/classify_v2/Dockerfile
    # classify_v2 listens on 5004; we keep the external port 5001 so the
    # frontend's VITE_API_BASE_URL stays portable across local and dev.
    ports:
      - "5001:5004"
    env_file: .env
    environment:
      - NER_API_URL=http://ner:5002
      - NEL_V2_API_URL=http://nel:5003
      - CLASSIFIER_VERSION=${CLASSIFIER_VERSION:-2.0.0}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-50000}
      - APPLICATION_MONGODB_URI=${APPLICATION_MONGODB_URI:-}
      - APPLICATION_DATABASE_NAME=${APPLICATION_DATABASE_NAME:-classifier_application_dev}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_API_MANAGED_SERVICE=${GCP_API_MANAGED_SERVICE:-}
      - GCP_API_KEYS_PARENT_LOCATION=${GCP_API_KEYS_PARENT_LOCATION:-global}
      - MAX_API_KEYS_PER_USER=${MAX_API_KEYS_PER_USER:-5}
      - TARGET_ENVIRONMENT_TYPE=${TARGET_ENVIRONMENT_TYPE:-local}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # ADC for google-cloud-api-keys — must match the bind-mount below.
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp_service_account.json
    volumes:
      # Bind-mount a host-side service-account JSON to the path above.
      # Set GCP_SERVICE_ACCOUNT_JSON in .env to the absolute host path.
      - ${GCP_SERVICE_ACCOUNT_JSON:-/dev/null}:/run/secrets/gcp_service_account.json:ro
    depends_on:
      ner:
        condition: service_started
      nel:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/v2/classify/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-cache:

secrets:
  HF_TOKEN:
    environment: HF_TOKEN
