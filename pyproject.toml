# Root pyproject.toml — monorepo manifest only. It has no dependencies, so
# there is nothing to install here. See README.md to set up module projects.

[tool.poetry]
name = "tabiya-livelihoods-classifier"
version = "1.0.0"
description = "Monorepo root — see subdirectory pyproject.toml files for services"
authors = ["Tabiya <tabiya@tabiya.org>"]
# Not an installable package: Poetry must not try to install the root project.
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
